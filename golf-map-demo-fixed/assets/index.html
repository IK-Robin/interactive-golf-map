<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10291f">
  <title>Green Valley — Self-contained Interactive Course Guide</title>
  <style>
:root {
  --ink:#173326;
  --cream:#f5f0e5;
  --gold:#d6ad55;
  --green:#1f6545;
  --glass:rgba(15,43,31,.92)
}
* {
  box-sizing:border-box
}
html,
body {
  margin:0;
  min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  background:#0d241b;
  color:#fff
}
body {
  background:radial-gradient(circle at 20% 0,#24523d 0,transparent 32%),#0d241b
}
.app {
  max-width:1500px;
  margin:auto;
  padding:22px
}
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:4px 3px 18px
}
.eyebrow {
  text-transform:uppercase;
  letter-spacing:.18em;
  color:#d7bd82;
  font-size:11px;
  font-weight:800
}
.topbar h1 {
  font-family:Georgia,serif;
  font-weight:500;
  font-size:clamp(27px,4vw,48px);
  line-height:1;
  margin:7px 0 0
}
.book,
.flyover {
  border:0;
  border-radius:100px;
  padding:13px 19px;
  background:var(--gold);
  color:#14291f;
  font-weight:850;
  cursor:pointer;
  box-shadow:0 8px 25px #0003
}
.book span {
  padding-left:8px
}
.map-shell {
  height:min(74vh,820px);
  min-height:520px;
  position:relative;
  overflow:hidden;
  border-radius:24px;
  background:#b5d095;
  box-shadow:0 25px 80px #0007;
  border:1px solid #ffffff30
}
.map-stage {
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
  cursor:grab
}
.map-stage.grabbing {
  cursor:grabbing
}
.map-content {
  position:absolute;
  inset:0;
  transform-origin:0 0;
  will-change:auto
}
.svg-layer {
  position:absolute;
  inset:0
}
.svg-layer svg {
  width:100%;
  height:100%;
  display:block
}
.overlay {
  pointer-events:none
}
.overlay svg {
  overflow:visible
}
.hole-hit,
.facility-hit {
  pointer-events:auto;
  cursor:pointer;
  fill:transparent;
  stroke:transparent;
  stroke-width:5;
  vector-effect:non-scaling-stroke;
  transition:fill .25s,stroke .25s,filter .25s
}
.hole-hit:hover,
.hole-hit.active {
  fill:#e3bd4055;
  stroke:#fff;
  filter:drop-shadow(0 0 8px #fff8)
}
.facility-hit {
  fill:#fff0;
  stroke:#fff0
}
.facility-hit:hover {
  fill:#fff3;
  stroke:#fff
}
.shot-path {
  fill:none!important;
  stroke:#fff!important;
  stroke-width:4px!important;
  stroke-linecap:round!important;
  stroke-dasharray:10 10!important;
  vector-effect:non-scaling-stroke;
  opacity:0;
  pointer-events:none
}
.shot-path.play {
  opacity:1!important;
  animation:dash 1.4s linear infinite
}
@keyframes dash {
  to {
    stroke-dashoffset:-40
  }
}
.hole-nav {
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
  padding:7px;
  border-radius:18px;
  background:var(--glass);
  backdrop-filter:blur(12px);
  z-index:8
}
.hole-nav button,
.controls button {
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#ffffff12;
  color:white;
  font-weight:800;
  cursor:pointer
}
.hole-nav button:hover,
.hole-nav button.active,
.controls button:hover {
  background:var(--gold);
  color:var(--ink)
}
.controls {
  position:absolute;
  right:18px;
  top:18px;
  display:grid;
  grid-template-columns:repeat(2,42px);
  gap:7px;
  padding:7px;
  border-radius:17px;
  background:var(--glass);
  z-index:8
}
.legend {
  position:absolute;
  left:18px;
  top:18px;
  display:flex;
  gap:15px;
  padding:10px 14px;
  background:#f8f2e8e8;
  color:var(--ink);
  border-radius:100px;
  font-size:12px;
  font-weight:750;
  z-index:5
}
.dot {
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:6px
}
.dot.hole {
  background:#d49e28
}
.dot.place {
  background:#2f7355
}
.tooltip {
  position:fixed;
  z-index:20;
  pointer-events:none;
  opacity:0;
  transform:translate(12px,12px);
  padding:9px 12px;
  border-radius:10px;
  background:#102a20;
  color:#fff;
  font-size:12px;
  font-weight:750;
  box-shadow:0 8px 28px #0005;
  transition:opacity .15s
}
.tooltip.show {
  opacity:1
}
.detail-card {
  position:absolute;
  top:18px;
  right:78px;
  width:min(330px,calc(100% - 36px));
  padding:23px;
  border-radius:20px;
  background:var(--glass);
  backdrop-filter:blur(15px);
  box-shadow:0 22px 60px #0006;
  z-index:10;
  transform:translateX(calc(100% + 110px));
  transition:transform .35s cubic-bezier(.2,.8,.2,1)
}
.detail-card.open {
  transform:none
}
.close {
  float:right;
  border:0;
  background:#ffffff14;
  color:white;
  width:30px;
  height:30px;
  border-radius:50%;
  font-size:21px;
  cursor:pointer
}
.card-number {
  font:50px/1 Georgia,serif;
  color:#e1bd6e
}
.card-label {
  color:#d7bd82;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  font-weight:900
}
.detail-card h2 {
  font:26px/1.1 Georgia,serif;
  margin:8px 0 15px
}
.detail-card p {
  font-size:13px;
  line-height:1.65;
  color:#dbe6df
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}
.stats div {
  padding:10px;
  border-radius:10px;
  background:#ffffff0d
}
.stats small {
  display:block;
  color:#aec2b7;
  font-size:10px;
  text-transform:uppercase
}
.stats strong {
  font:22px Georgia,serif
}
.tee-row {
  display:flex;
  justify-content:space-between;
  padding:13px 2px;
  font-size:11px;
  color:#b9cbc0
}
.tee-row b {
  display:block;
  color:white;
  font-size:13px;
  margin-top:3px
}
.flyover {
  width:100%;
  padding:12px;
  font-size:12px
}
footer {
  display:flex;
  justify-content:space-between;
  color:#a6b9ae;
  font-size:12px;
  padding:16px 3px 0
}
footer p {
  margin:0
}
@media(max-width:700px) {
  .app {
    padding:10px
  }
  .topbar {
    align-items:center;
    padding:8px 4px 13px
  }
  .book {
    padding:10px 12px;
    font-size:11px
  }
  .map-shell {
    min-height:620px;
    height:78vh;
    border-radius:18px
  }
  .legend {
    top:12px;
    left:12px
  }
  .controls {
    right:12px;
    top:62px
  }
  .detail-card {
    top:auto;
    bottom:75px;
    left:12px;
    right:12px;
    width:auto;
    transform:translateY(calc(100% + 90px))
  }
  .detail-card.open {
    transform:none
  }
  .hole-nav {
    bottom:12px;
    gap:3px
  }
  .hole-nav button {
    width:36px;
    height:38px
  }
  .topbar h1 {
    font-size:25px
  }
  footer {
    display:none
  }
}

/* Phone presentation: keep a real 600px-tall interactive viewport. */
@media(max-width:600px){
  body{padding-top:0}
  .app{padding:0 8px 82px}
  .map-shell{
    width:100%;
    max-width:600px;
    height:600px;
    min-height:600px;
    aspect-ratio:auto;
    border-radius:14px;
  }
  .map-stage,.map-content,.svg-layer{
    width:100%;
    height:600px;
    min-height:600px;
  }
  .svg-layer svg{
    width:100%!important;
    height:100%!important;
    min-height:600px;
    overflow:visible;
  }
  .map-shell.cinematic .golf-ball{filter:drop-shadow(0 5px 4px #0009)}
  .map-shell.cinematic .ball-distance{filter:drop-shadow(0 4px 6px #000c)}
  .map-shell.cinematic .ball-distance rect,.map-shell.cinematic .ball-distance>path{stroke-width:1.25}
  .map-shell.cinematic .ball-distance text{font-size:18px}
  .hole-nav-rail{bottom:-62px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Single-SVG responsive presentation: the SVG owns its static background image. */
@media(max-width:992px){
  .map-stage{inset:0;background:#9fc481}
  .map-content,.svg-layer{inset:0;width:100%;height:100%}
  .svg-layer svg{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none;max-height:none;display:block}
}

/* Mobile map card: clip only the SVG viewport so tooltips/cards may escape. */

.hole-nav-arrow{display:none}

/* FINAL NAVIGATION FIX

   --hole-count is assigned from HOLES.length in buildNavigation(). */
.hole-nav-rail,

  right:auto;
  bottom:18px;

  right:auto;

function fly(path,ball,shadow,counter,pulse,token){const len=path.getTotalLength(),duration=5200,start=performance.now(),h=ITEMS[active],total=Number(h[selectedTee]||h.yards),text=counter.querySelector('text'),phone=matchMedia('(max-width:600px)').matches;return new Promise(resolve=>{function frame(now){if(token!==flightToken)return resolve();const t=Math.min(1,(now-start)/duration),progress=ease(t),p=path.getPointAtLength(len*progress),phase=t<.56?t/.56:(t-.56)/.44,arc=Math.sin(phase*Math.PI)*(t<.56?42:27),bs=(1+arc/120)*(phone?1.28:1),offset=phone?50:38;ball.setAttribute('transform',`translate(${p.x} ${p.y-arc}) scale(${bs})`);shadow.setAttribute('cx',p.x);shadow.setAttribute('cy',p.y+8);shadow.setAttribute('rx',13+arc/6);shadow.style.opacity=.34-arc/180;counter.setAttribute('transform',`translate(${p.x} ${p.y-arc-offset}) scale(${phone?1.12:1})`);text.textContent=`${Math.round(total*progress)} yd`;if(t<1)flightFrame=requestAnimationFrame(frame);else{text.textContent=`${total} yd`;pulse.setAttribute('cx',p.x);pulse.setAttribute('cy',p.y);resolve()}}flightFrame=requestAnimationFrame(frame)})}function stopCinematic(){cancelAnimationFrame(flightFrame);flightToken++;$('#mapShell').classList.remove('cinematic');hideTip();['#golfBall','#ballShadow','#ballDistance','#targetPulse'].forEach(s=>$(s)?.classList.remove('active','complete'))}let resizeTimer=0;function refreshViewport(){applyResponsiveMapFit(false)}addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(refreshViewport,120)});document.addEventListener('fullscreenchange',()=>applyResponsiveMapFit(true));document.addEventListener('webkitfullscreenchange',()=>applyResponsiveMapFit(true));

  </script>
